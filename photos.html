<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photos</title>
  <link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>

<main class="container">

  <div class="logo-wrap">
    <img src="Delcocup%20logo.png" alt="Delco Cup Logo" class="logo">
  </div>

  <h1>Photos</h1>

  <!-- Upload / View Buttons -->
  <section class="card">
    <h2>Delco Cup Photos</h2>
    <p class="small">Upload a photo or view the full gallery.</p>

    <!-- IMPORTANT: match CSS class name -->
    <div class="btn-row">
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.dropbox.com/request/4l9paOEDZwa7gl8U2I31">
        Upload Photo
      </a>

      <a class="btn secondary" target="_blank" rel="noopener"
         href="https://www.dropbox.com/scl/fo/b0hvhi5od49qil9c4e76p/AAsV8bh1eYgjJ2p1feFLmkg?rlkey=zuesmdykiy1dpfz2yrr5jm2gh&dl=0">
        View Gallery
      </a>
    </div>
  </section>

  <!-- LIVE GALLERY -->
  <section class="card">
    <div class="live-head">
      <h2>Live Gallery</h2>
      <span class="pill" id="statusText">Loading…</span>
    </div>

    <div id="photo-grid" class="photo-grid"></div>
  </section>

</main>

<nav class="bottom-nav">
  <div class="nav-inner">
    <a class="nav-link" href="index.html">Welcome</a>
    <a class="nav-link" href="tee-times.html">Tee Times</a>
    <a class="nav-link" href="rooms.html">Rooms</a>
    <a class="nav-link active" href="photos.html">Photos</a>
    <a class="nav-link" href="rules.html">Rules</a>
  </div>
</nav>

<script>
  const API = "https://morning-pine-c289.hz7rv6p2c8.workers.dev";

  const grid = document.getElementById("photo-grid");
  const statusText = document.getElementById("statusText");

  function setStatus(msg){ statusText.textContent = msg; }

  async function loadPhotos() {
    setStatus("Loading…");
    grid.innerHTML = "";

    try {
      const res = await fetch(API + "/list", { cache: "no-store" });

      // If Worker returns an error (401/500), show the body in console
      if (!res.ok) {
        const text = await res.text();
        console.log("Worker /list error:", res.status, text);
        setStatus(`Error (${res.status})`);
        return;
      }

      const contentType = res.headers.get("content-type") || "";
      if (!contentType.includes("application/json")) {
        const text = await res.text();
        console.log("Non-JSON from /list:", text);
        setStatus("Service error (non-JSON)");
        return;
      }

      const data = await res.json();
      const photos = data.photos || [];

      if (!photos.length) {
        setStatus("No photos yet.");
        return;
      }

      setStatus(`${photos.length} items`);

      photos.forEach(item => {
        const a = document.createElement("a");
        a.href = item.file || item.thumb;   // fallback if file missing
        a.target = "_blank";
        a.rel = "noopener";

        const img = document.createElement("img");
        img.src = item.thumb;
        img.alt = item.name || "Photo";

        a.appendChild(img);
        grid.appendChild(a);
      });

    } catch (e) {
      console.error(e);
      setStatus("Error loading photos");
    }
  }

  loadPhotos();
</script>

</body>
</html>
