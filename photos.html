<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photos</title>
  <link rel="stylesheet" href="styles.css?v=7" />

  <style>
    /* Small page-only helpers (doesn't mess with your main CSS) */
    .live-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.10);
      font-weight:900;
      font-size:13px;
      color:#202d50;
      background:rgba(32,45,80,.06);
      white-space:nowrap;
    }
    .center-actions{
      display:flex;
      justify-content:center;
      margin-top:12px;
    }
    /* make button behave like your .btn but for <button> */
    .btn-button{
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
    }
  </style>
</head>

<body>
<main class="container">

  <div class="logo-wrap">
    <img src="Delcocup%20logo.png" alt="Delco Cup Logo" class="logo">
  </div>

  <h1>Photos</h1>

  <!-- Upload / View Buttons -->
  <section class="card">
    <h2>Delco Cup Photos</h2>
    <p class="small">Upload a photo or view the full gallery.</p>

    <div class="btn-row">
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.dropbox.com/request/4l9paOEDZwa7gl8U2I31">
        Upload Photo
      </a>

      <a class="btn secondary" target="_blank" rel="noopener"
         href="https://www.dropbox.com/scl/fo/b0hvhi5od49qil9c4e76p/AAsV8bh1eYgjJ2p1feFLmkg?rlkey=qj7qo3ygsfyjgtjhzwnvwdtxc&st=d00v0204&dl=0">
        View Gallery
      </a>
    </div>
  </section>

  <!-- LIVE GALLERY -->
  <section class="card">
    <div class="live-head">
      <h2>Live Gallery</h2>
      <span class="pill" id="statusText">Loading…</span>
    </div>

    <div id="photo-grid" class="photo-grid"></div>

    <div class="center-actions">
      <button id="loadMoreBtn" class="btn secondary btn-button" type="button">
        Load more
      </button>
    </div>
  </section>

</main>

<nav class="bottom-nav">
  <div class="nav-inner">
    <a class="nav-link" href="index.html">Welcome</a>
    <a class="nav-link" href="tee-times.html">Tee Times</a>
    <a class="nav-link" href="rooms.html">Rooms</a>
    <a class="nav-link active" href="photos.html">Photos</a>
    <a class="nav-link" href="rules.html">Rules</a>
  </div>
</nav>

<script>
  const API = "https://morning-pine-c289.hz7rv6p2c8.workers.dev";

  const grid = document.getElementById("photo-grid");
  const statusText = document.getElementById("statusText");
  const loadMoreBtn = document.getElementById("loadMoreBtn");

  let allPhotos = [];
  let showing = 0;
  const PAGE_SIZE = 30;

  function updateStatus(){
    if (!allPhotos.length) return;
    statusText.textContent = `Showing ${showing} of ${allPhotos.length}`;
    loadMoreBtn.style.display = (showing < allPhotos.length) ? "inline-flex" : "none";
  }

  function renderMore(){
    const next = allPhotos.slice(showing, showing + PAGE_SIZE);

    next.forEach(item => {
      const img = document.createElement("img");
      img.src = item.thumb;
      img.alt = item.name || "Photo";
      img.loading = "lazy";

      // Keep your current behavior (phone-friendly): open the original link
      // (may download depending on file type — that's normal for Dropbox links)
      img.addEventListener("click", () => {
        if (item.file) window.open(item.file, "_blank");
      });

      grid.appendChild(img);
    });

    showing += next.length;
    updateStatus();
  }

  async function loadPhotos(){
    try{
      statusText.textContent = "Loading…";
      grid.innerHTML = "";
      loadMoreBtn.style.display = "none";

      const res = await fetch(API + "/list", { cache: "no-store" });
      const data = await res.json();

      allPhotos = Array.isArray(data.photos) ? data.photos : [];
      if (!allPhotos.length){
        statusText.textContent = "No photos yet.";
        return;
      }

      showing = 0;
      renderMore();
    } catch(e){
      console.error(e);
      statusText.textContent = "Error loading photos";
    }
  }

  loadMoreBtn.addEventListener("click", renderMore);
  loadPhotos();
</script>

</body>
</html>
