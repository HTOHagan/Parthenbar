<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photos</title>
  <link rel="stylesheet" href="styles.css?v=7" />
  <style>
    /* Tiny add-ons just for the IG-like viewer (keeps your main CSS untouched) */
    .live-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.10);
      font-weight:900;
      font-size:13px;
      color:#202d50;
      background:rgba(32,45,80,.06);
      white-space:nowrap;
    }

    /* Fullscreen viewer */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.92);
      display:none;
      z-index:9999;
    }
    .modal.open{ display:block; }

    .modal-top{
      position:absolute;
      top:10px;
      left:10px;
      right:10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      color:#fff;
      font-weight:900;
    }
    .modal-title{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:75vw;
      font-size:14px;
      opacity:.9;
    }
    .modal-close{
      border:0;
      background:rgba(255,255,255,.12);
      color:#fff;
      border-radius:999px;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
    }

    .modal-body{
      position:absolute;
      inset:56px 0 0 0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      touch-action:pan-y;
    }
    .modal-img{
      max-width:95vw;
      max-height:82vh;
      object-fit:contain;
      border-radius:14px;
      background:rgba(255,255,255,.06);
    }

    .nav-btn{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:rgba(255,255,255,.12);
      color:#fff;
      border-radius:999px;
      width:44px;
      height:44px;
      font-size:22px;
      font-weight:900;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .nav-btn.left{ left:12px; }
    .nav-btn.right{ right:12px; }

    @media (max-width: 520px){
      .nav-btn{ display:none; } /* swipe on mobile */
    }
  </style>
</head>
<body>

<main class="container">

  <div class="logo-wrap">
    <!-- IMPORTANT: match your actual filename (you used %20 elsewhere) -->
    <img src="Delcocup%20logo.png" alt="Delco Cup Logo" class="logo">
  </div>

  <h1>Photos</h1>

  <!-- Upload / View Buttons -->
  <section class="card">
    <h2>Delco Cup Photos</h2>
    <p class="small">Upload a photo or view the full gallery.</p>

    <!-- use btn-row to match your CSS -->
    <div class="btn-row">
      <a class="btn"
         target="_blank"
         rel="noopener"
         href="https://www.dropbox.com/request/4l9paOEDZwa7gl8U2I31">
        Upload Photo
      </a>

      <a class="btn secondary"
         target="_blank"
         rel="noopener"
         href="https://www.dropbox.com/scl/fo/b0hvhi5od49qil9c4e76p/AAsV8bh1eYgjJ2p1feFLmkg?rlkey=qj7qo3ygsfyjgtjhzwnvwdtxc&st=d00v0204&dl=0">
        View Gallery
      </a>
    </div>
  </section>

  <!-- LIVE GALLERY -->
  <section class="card">
    <div class="live-head">
      <h2>Live Gallery</h2>
      <span class="pill" id="statusText">Loading…</span>
    </div>

    <div id="photo-grid" class="photo-grid"></div>
  </section>

</main>

<nav class="bottom-nav">
  <div class="nav-inner">
    <a class="nav-link" href="index.html">Welcome</a>
    <a class="nav-link" href="tee-times.html">Tee Times</a>
    <a class="nav-link" href="rooms.html">Rooms</a>
    <a class="nav-link active" href="photos.html">Photos</a>
    <a class="nav-link" href="rules.html">Rules</a>
  </div>
</nav>

<!-- Fullscreen modal -->
<div class="modal" id="modal">
  <div class="modal-top">
    <div class="modal-title" id="modalTitle">Photo</div>
    <button class="modal-close" id="modalClose">✕</button>
  </div>

  <button class="nav-btn left" id="prevBtn">‹</button>
  <button class="nav-btn right" id="nextBtn">›</button>

  <div class="modal-body" id="modalBody">
    <img class="modal-img" id="modalImg" alt="Photo" />
  </div>
</div>

<script>
  const API = "https://morning-pine-c289.hz7rv6p2c8.workers.dev";

  const grid = document.getElementById("photo-grid");
  const statusText = document.getElementById("statusText");

  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  const modalTitle = document.getElementById("modalTitle");
  const modalClose = document.getElementById("modalClose");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const modalBody = document.getElementById("modalBody");

  let photos = [];
  let currentIndex = 0;

  function openModal(index){
    currentIndex = index;
    const item = photos[currentIndex];

    // Use the full file link (best “IG-like” view)
    // If file is missing for any reason, fall back to thumb.
    modalImg.src = item.file || item.thumb;
    modalTitle.textContent = item.name || "Photo";

    modal.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeModal(){
    modal.classList.remove("open");
    document.body.style.overflow = "";
    modalImg.src = "";
  }

  function showNext(){
    if (!photos.length) return;
    currentIndex = (currentIndex + 1) % photos.length;
    openModal(currentIndex);
  }

  function showPrev(){
    if (!photos.length) return;
    currentIndex = (currentIndex - 1 + photos.length) % photos.length;
    openModal(currentIndex);
  }

  // Swipe support
  let startX = 0;
  let startY = 0;
  let swiping = false;

  modalBody.addEventListener("touchstart", (e) => {
    if (!modal.classList.contains("open")) return;
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    swiping = true;
  }, { passive: true });

  modalBody.addEventListener("touchend", (e) => {
    if (!swiping) return;
    swiping = false;

    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;

    // ignore mostly-vertical gestures
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;

    if (dx < 0) showNext();
    else showPrev();
  }, { passive: true });

  // Close behavior
  modalClose.addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => {
    // click outside image area closes
    if (e.target === modal) closeModal();
  });

  // Buttons
  nextBtn.addEventListener("click", showNext);
  prevBtn.addEventListener("click", showPrev);

  // Keyboard
  window.addEventListener("keydown", (e) => {
    if (!modal.classList.contains("open")) return;
    if (e.key === "Escape") closeModal();
    if (e.key === "ArrowRight") showNext();
    if (e.key === "ArrowLeft") showPrev();
  });

  async function loadPhotos() {
    grid.innerHTML = "";
    statusText.textContent = "Loading…";

    try {
      const res = await fetch(API + "/list", { cache: "no-store" });
      const data = await res.json();

      photos = Array.isArray(data.photos) ? data.photos : [];

      if (!photos.length) {
        statusText.textContent = "No photos yet.";
        return;
      }

      statusText.textContent = photos.length + " photos";

      photos.forEach((item, idx) => {
        const img = document.createElement("img");
        img.src = item.thumb;
        img.alt = item.name || "Photo";
        img.loading = "lazy";
        img.addEventListener("click", () => openModal(idx));
        grid.appendChild(img);
      });

    } catch (e) {
      statusText.textContent = "Error loading photos";
      console.error(e);
    }
  }

  loadPhotos();
</script>

</body>
</html>
